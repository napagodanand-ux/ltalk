name: Deploy Web

# Builds the LTalk web client (the renderer, run directly in the browser) and
# publishes it to GitHub Pages. The web app is "alive" — served live and not
# version-pinned like the desktop auto-updater.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write build-time env
        shell: bash
        run: printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "${{ vars.VITE_SUPABASE_URL }}" "${{ vars.VITE_SUPABASE_ANON_KEY }}" > .env

      - name: Install dependencies
        run: npm ci

      - name: Build web client
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # SPA fallback so deep links resolve to index.html on GitHub Pages.
      - name: SPA fallback
        run: cp dist-web/index.html dist-web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
