[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltalk"
version = "1.0.0"
description = "LTalk — Secure Messaging for Linux"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "LTalk Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/Chat",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "supabase>=2.3",
    "cffi>=1.16",
    "dasbus>=1.7",
    "secretstorage>=3.3",  # For secure key storage (GNOME Keyring, KDE Wallet)
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "qasync>=0.27",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]
full = [
    "PySide6>=6.6",
    "qasync>=0.27",
    "PySide6-QtWebEngine>=6.6",
]
keyring = [
    "secretstorage>=3.3",  # For secure key storage
]
sqlcipher = [
    "pysqlcipher3>=1.2",  # For encrypted database
]

[project.scripts]
ltalk = "ltalk_app.main:main"
ltalkd = "ltalkd.main:main"

[project.gui-scripts]
ltalk = "ltalk_app.main:main"

[project.urls]
Homepage = "https://github.com/nickvdyck/ltalk"
Repository = "https://github.com/nickvdyck/ltalk"
Issues = "https://github.com/nickvdyck/ltalk/issues"

[tool.setuptools.packages.find]
include = ["ltalk_core*", "ltalk_app*", "ltalkd*"]

[tool.setuptools.package-data]
"ltalk_app" = ["resources/qml/**/*.qml", "resources/qml/**/*.js"]
"ltalk_core" = ["crypto/libsignal_ffi.so"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
